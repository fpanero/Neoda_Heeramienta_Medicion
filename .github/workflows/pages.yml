name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # cada lunes: refresca la copia de respaldo de NASA POWER

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy pymannkendall pytest
      - run: pytest -q pipeline/tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # La copia de respaldo se reutiliza entre despliegues; se regenera los lunes, a mano o si cambian las regiones
      - name: Recuperar copia de respaldo de NASA POWER
        id: snap
        uses: actions/cache/restore@v4
        with:
          path: web/data/power
          key: power-${{ hashFiles('web/config/regions.json', 'web/config/variables.json') }}-${{ github.run_id }}
          restore-keys: power-${{ hashFiles('web/config/regions.json', 'web/config/variables.json') }}-
      - name: Regenerar copia de respaldo (si falla, la web sigue usando la API en directo)
        if: github.event_name != 'push' || steps.snap.outputs.cache-matched-key == ''
        continue-on-error: true
        timeout-minutes: 40
        run: python pipeline/fetch_power.py
      - name: Guardar copia de respaldo
        if: github.event_name != 'push' || steps.snap.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: web/data/power
          key: power-${{ hashFiles('web/config/regions.json', 'web/config/variables.json') }}-${{ github.run_id }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Precalcular series anuales para el mapa de España
        continue-on-error: true
        run: node pipeline/build_map_data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4
