name: Actualizar datos de la NASA

# Ejecución manual desde la pestaña Actions. Necesita los secretos del repositorio
# EARTHDATA_USERNAME y EARTHDATA_PASSWORD (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Regiones separadas por espacios (vacío = todas)"
        required: false
        default: ""
      variables:
        description: "Variables separadas por espacios (vacío = todas las que tienen adaptador)"
        required: false
        default: ""
      start:
        description: "Año inicial"
        default: "2001"
      end:
        description: "Año final"
        default: "2025"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r pipeline/requirements.txt
      - name: Descargar y promediar por región
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          IN_REGIONS: ${{ github.event.inputs.regions }}
          IN_VARIABLES: ${{ github.event.inputs.variables }}
          IN_START: ${{ github.event.inputs.start }}
          IN_END: ${{ github.event.inputs.end }}
        run: |
          cd pipeline
          ARGS="--start $IN_START --end $IN_END"
          [ -n "$IN_REGIONS" ] && ARGS="$ARGS --regions $IN_REGIONS"
          [ -n "$IN_VARIABLES" ] && ARGS="$ARGS --variables $IN_VARIABLES"
          python fetch_nasa.py $ARGS
      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "Datos NASA actualizados"
          git push
